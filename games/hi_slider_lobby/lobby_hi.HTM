<html>
  <head>
    <style>
        img {border-style:inset;border-width:1;border-color:black; } 
    </style>
    <title>Noah Puzzle</title>
  </head>
  <body onkeydown="HandleKey()" bgcolor="#000000" bgproperties="fixed">
    <DIV id="PUZZLE"></DIV>
    <DIV id="STATISTICS"></DIV>
    
    <OBJECT ID="Player" CLASSID="CLSID:6BF52A52-394A-11d3-B153-00C04F79FAA6" 
      style="position:absolute;top:0;left:0" VIEWASTEXT width="0" height="0">
      <PARAM name="url" value="lobby.mpg">      
      <PARAM name="autoStart" value="false">
      <PARAM name="stretchToFit" value="true">
    </OBJECT>
    <EMBED name="SLASH" src="slash.wav" autostart="false" hidden="false" WIDTH="0" HEIGHT="0">
    <EMBED name="SLAM" src="Metallic.asf" autostart="false" hidden="false" WIDTH="0" HEIGHT="0">
<script>       
var finalImage = new Image(800,600); finalImage.src = "bigimage.jpg";
var across = 3;
var down = 3;
var basename = "image";
var suffix = ".jpg";
var num = across*down; // number of images.
var width = parseInt(finalImage.width/across);
var height = parseInt(finalImage.height/down);
var changed = false;
var sliding = false;
var selected = null;
var finished = false;
var blankx = 0; // initial blank position is top right.
var blanky = down-1;
var fading = null;
var startime = 0;
var fadeTime = 3000;

// shuffle quadrants
var q1 = new Array(1,-1);
var q2 = new Array(1, 1);
var q3 = new Array(-1, 1);
var q4 = new Array(-1, -1);

// load up the images.
var images = PreLoadImages()
  
// display the images
DisplayImages();

var elements = FindElements();

// jumble the images.
Shuffle();

now= new Date();					//Tim. Get starting time in Millsecs
startat=now.getTime(); 		//Tim. 

window.onbeforeunload = CheckUnload;

function PreLoadImages() {
    var images = new Array(num);
    for (i = 0; i < num; i++) {
        var id = basename + i;
        var img = new Image(width,height);
        img.src = id+suffix;
        images[i] = img;
    }
    return images;
}


function DisplayImages() {
    var html = "";
    var i = 0;
    for (y = 0; y < down; y++) {
        for (x = 0; x < across; x++) {
            if (x != blankx || y != blanky) {
                var homex = x;
                var homey = y;
                var id = basename + i;
                var left = x*width;
                var top = y*height;
                html += "<IMG id='"+id+"' style='position:absolute;top="+top+";left="+left+"' x='"+x+"' y='"+y+"' onmousedown='select()' src='"+id+suffix+"' width='"+width+"' height='"+height+"' homex='"+homex+"' homey='"+homey+"'>\n";    
            }
            i++;
        }
    }
    PUZZLE.innerHTML = html;    
}

function FindElements() {
    var result = new Array();
    for (i = 0; i < num; i++) {
        var e = document.all(basename+i);
        result[i] = e;
    }
    return result;
}

function Shuffle() {
    window.status = "";
    for (i = 0; i < 500; i++) {
        var x = blankx;
        var y = blanky;
        var choices = new Array();
        var j = 0;
        if (x < across-1 && y > 0) choices[j++] = q1;
        if (x < across-1 && y < down-1) choices[j++] = q2;
        if (x > 0 && y < down-1) choices[j++] = q3;
        if (x > 0 && y > 0) choices[j++] = q4;
        var k = parseInt(Math.random()*j);
        var quad = choices[k];
        var moves = 1+parseInt(Math.random()*2);
        if (moves > 0) Move(quad[0], 0);
        if (moves > 1) Move(0, quad[1]);
        if (moves > 2) Move(-quad[0], 0);
    }
    window.status = "shuffled";
}

function Move(dx,dy) 
{
    var e = FindImage(blankx+dx, blanky+dy);
    if (e == null) {
        window.status = "internal error";
    } else {
        var x = parseInt(e.x);
        var y = parseInt(e.y);
        e.x = blankx;
        e.y = blanky;
        e.style.left = GetOffset(e.style.left)+(-dx*width);
        e.style.top = GetOffset(e.style.top)+(-dy*height);   
        blankx += dx;
        blanky += dy;
    }
}

function select() {
    if (sliding || finished) {
        return;
    }
    var e = event.srcElement;
    var x = parseInt(e.x);
    var y = parseInt(e.y);
    selected = null;
    var i = 0;
    if (x == blankx && y != blanky) {
        var dy = (y > blanky) ? -1 : 1;        
        selected = new Array();
        while (y != blanky) {
            e = FindImage(x,y);
            e.dx = 0;
            e.dy = dy;
            e.step = parseInt(height/10);
            e.targetx = GetOffset(e.style.left);
            e.targety = GetOffset(e.style.top)+(dy*height);
            selected[i++] = e;
            y += dy;
        }        
    } else if (e.y == blanky && x != blankx) {
        var dx = (x > blankx) ? -1 : 1;     
        selected = new Array();
        while (x != blankx) {            
            e = FindImage(x,y);
            e.dx = dx;
            e.dy = 0;
            e.step = parseInt(width/10);
            e.targetx = GetOffset(e.style.left)+(dx*width);
            e.targety = GetOffset(e.style.top);
            selected[i++] = e;
            x += dx;
        }        
    }
    if (selected != null) {            
        sliding = true;
        changed = true;        
        SLASH.play();
        window.setTimeout("slide()",1);
    }
}
function slide() {
    var dx = 0;
    var dy = 0;
    for (i = 0; i < selected.length; i++) {
        var e = selected[i];           
        dx = parseInt(e.dx);
        dy = parseInt(e.dy);
        var x = GetOffset(e.style.left);
        var y = GetOffset(e.style.top);
        var newx = x+(dx*e.step);
        var newy = y+(dy*e.step);            
        if (Math.abs(newx-e.targetx) <= Math.abs(e.step)) newx = e.targetx;
        if (Math.abs(newy-e.targety) <= Math.abs(e.step)) newy = e.targety;
        e.style.left = newx;
        e.style.top = newy;
        if (newx == e.targetx && newy == e.targety) {
            sliding = false;
            e.x = parseInt(e.x)+dx;
            e.y = parseInt(e.y)+dy;
        } 
    }
    if (!sliding) {
        blankx -= dx * selected.length;
        blanky -= dy * selected.length;        
        CheckComplete();
    } else {
        window.setTimeout("slide()",1);
    }
}

function FindImage(x,y) 
{    
    var i = 0;
    for (i = 0; i < num; i++) {
        var e = elements[i];
        if (e != null && e.x == x && e.y == y) {
            return e;
        }
    }
    return null;
}
function GetOffset(measure) {
    var s = ""+measure;
    return parseInt(s.substr(0,s.length-2)); // take units of measure off.
}
function CheckComplete() {
    var count = 0;
    var i = 0;
    for (i = 0; i < num; i++) {
        var e = document.all(basename+i);
        if (e != null && e.x == e.homex && e.y == e.homey) {
            count++;
        }
    }
    if (count == num-1) 
        Finish();
}
function CheckUnload() 
{
    if (changed && !finished) {
        event.cancelBubble = true;
        event.returnValue = "Your game so far will be lost.";
    }
}    
function Finish() 
{
    finished = true;
    SLAM.play();
    //PUZZLE.innerHTML = "<img style='filter:Alpha(opacity=100)' id='final' src="+finalImage.src+" width="+finalImage.width+" height="+finalImage.height+" style='position:absolute;top:0;left:0'>";
    now = new Date();   								//TL. Get finish date
    finishat = now.getTime(); 					//TL. Convert to milliseconds
    timetaken = (finishat-startat)/1000;		//TL. Convert to seconds 
    var top = finalImage.height+ 5;
    STATISTICS.innerHTML = "<p style='position:absolute;top:"+top+";left:10'><font color='red' size=5><font face=Arial>" + timetaken +" seconds" + "</font></p>" ;
    //FadeElement(document.all("final"));
    window.setTimeout("MovieTime()", 1);   //was3000
}
function MovieTime() 
{
    //STATISTICS.innerHTML = ""; //ok
    Player.width = finalImage.width;
    Player.height = finalImage.height;
    Player.uiMode = "none";
    Player.controls.play();
    //So, how do you know when the movie is finished? 
    //And then how do you automatically link to another puzzle.htm?
}

function FadeElement(e)
{
  fading = e;
  var d = new Date();
  startime= d.getTime();
  window.setTimeout("fade()",1);
}

function fade()
{
  if (fading.filters.item("Alpha").opacity != 0) {   
    var d = new Date();
    var y = (d.getTime() - startime );
    var t = Math.max(0, 100 - ((100 * y) / fadeTime));
    fading.filters.item("Alpha").opacity = t;
    window.setTimeout("fade()",1);
  }
}

// This is a useful way to debug the final scene, just uncomment the following line:
//window.setTimeout("Finish()",1000);

var KEY_F2 = 113;
var KEY_F9 = 120;
function HandleKey() {
    if (event.keyCode == KEY_F2) {
        Finish();
    } else if (event.keyCode == KEY_F9) {
        Shuffle();
    }
}
        </script>
  </body>
</html>
