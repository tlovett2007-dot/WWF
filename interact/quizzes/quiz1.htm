startat=now.getTime() 		//Tim. 
ns="0123456789"
ls="abcde";
astr="";
ack=new Array();

for (var i=0;i<nq;i++){

function lightIt(){			//MouseOver the button.

 if (ack[Math.floor(flg/nop)]!=flg){
  document.images[flg+ad].src="rbd.gif";
  }
 }
function dumpIt(){			//Deselect it....
 if (ack[Math.floor(flg/nop)]==flg){
  document.images[ack[Math.floor(flg/nop)]+ad].src="rbd.gif";
  ack[Math.floor(flg/nop)]=(nq*nop)+1;
  }
 else{							//else Select it...
  if (ack[Math.floor(flg/nop)]!=flg&&ack[Math.floor(flg/nop)]!=(nq*nop)+1){
   document.images[ack[Math.floor(flg/nop)]+ad].src="rbd.gif";
   }
  document.images[flg+ad].src="rbl.gif";
  ack[Math.floor(flg/nop)]=flg;
  }
 }
 




//When you click the score button................................................................... 
function ckSco(){  
 numskip=0; numwrg=0; numcorrect=0
 document.images[ad+(nq*nop)].src="button_down.jpg";  

 for (var i=0;i<nq;i++){   //Stick the green arrows in...
  u=cor.charAt(i);
  v=ls.indexOf(u)+(i*nop);
  document.images[ad+v].src="gbl.gif";
  }
 sco=psco;     //Add up score...
 for (var i=0;i<nq;i++){
  if (ack[i]==(nq*nop)+1){
   sco-=noans;    	//take off skipped questions
   numskip++			//Tim. Count skipped questions
   }
  else{
   u=cor.charAt(i);
   v=ls.indexOf(u)+(i*nop);
   sco=(v==ack[i]?sco:sco-wrans);   		//Take off wrong answers
   numwrg=(v==ack[i]?numwrg:numwrg+1);	//TL. Count wrong answers
   }       
  }
 sco=(sco<0?0:sco); 							// prevent minus score
 scos=""+sco; 
 while (scos.length<3){
   scos="0"+scos; 
   }  
  
  numcorrect = nq-numskip-numwrg
  now = new Date								//TL. Get finish date

  timetaken = (finishat-startat)/1000		//TL. Convert to seconds 
 
  if (sco==100) {								//TL. Score based comments...
     scoretext = "Well done, you scored "
  }
  if (sco<50){
     scoretext = "Whoops, you scored " 
  }

 }
